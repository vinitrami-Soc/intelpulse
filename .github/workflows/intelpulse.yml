# IntelPulse — the checks a contributor runs locally, run on every change.
#
# Until this existed, 262 assertions passed on one machine and nothing enforced
# them on a push. The three jobs below are exactly `make test`, `make test-web`
# and `make test-ui`, so a green run here means the same thing as a green run
# in a terminal.
#
# pip-audit is deliberately NOT here: a new advisory against a pinned dependency
# would turn an unrelated pull request red, which teaches people to ignore red.
# It runs on a schedule instead — see audit.yml.

name: IntelPulse

# Branches are covered by pull_request and main by push. Listing every branch
# under push as well ran all five jobs twice on the same commit — same result,
# double the minutes, and two of each check on the pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first: nobody reads the older run.
concurrency:
  group: intelpulse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend · 200 tests + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Test
        working-directory: backend
        # No network, no API keys, no Redis: the providers are stubbed, so a
        # failure here is the pipeline's own behaviour and not a vendor's.
        run: pytest -q

  engine:
    name: engine parity + model + design guards · 56 tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test
        # These pin the JavaScript engine to the Python scoring rules and hold
        # the design system's static guards, so demo mode cannot drift.
        run: node --test web/tests/*.test.mjs

  browser:
    name: browser · ${{ matrix.spec.name }}
    # Pinned: ubuntu-latest became 26.04, which Playwright 1.56.1 cannot
    # install Chromium on ("does not support chromium on ubuntu26.04-x64").
    # Move with the Playwright upgrade that supports it, together.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        spec:
          - { file: ui.spec.mjs,     name: "workbench + campaign graph · 96 checks" }
          - { file: suite.spec.mjs,  name: "site + console · 87 checks" }
          - { file: mobile.spec.mjs, name: "phone, tablet, assistant · 99 checks" }
          - { file: security.spec.mjs, name: "security: hostile API, storage, CSP · 27 checks" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The project has no package.json on purpose — no build step, no
      # node_modules, a reviewer opens the file. Playwright is installed out of
      # tree and handed to the specs through PLAYWRIGHT_MODULE, which they
      # already support, so that stays true.
      - name: Install Playwright
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Serve web/
        run: |
          # nohup + a log file: a background process still holding the step's
          # stdout can keep the step from ever finishing.
          nohup python3 -m http.server 8123 --bind 127.0.0.1 --directory web \
            > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8123/; then exit 0; fi
            sleep 1
          done
          echo "the static server never came up"
          cat "$RUNNER_TEMP/serve.log"
          exit 1

      - name: Test
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
          INTELPULSE_URL: http://127.0.0.1:8123/
        run: node web/tests/${{ matrix.spec.file }}

  server:
    name: browser · server mode · setup, sign-in, triage
    # The other browser jobs run the static demo. This one runs the same pages
    # served by the app, on a brand-new server (SQLite, no provider keys): set
    # up with the one-time code, triage from the workbench, sign out and in.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the server
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install Playwright
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start a new server
        working-directory: backend
        run: |
          # A throwaway key and database, made for this run only.
          echo "ENCRYPTION_KEY=$(python -c 'import base64,os;print(base64.b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
          echo "DATABASE_URL=sqlite+aiosqlite:///$RUNNER_TEMP/server.db" >> "$GITHUB_ENV"
      - name: Serve
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8124 > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8124/api/health; then exit 0; fi
            sleep 1
          done
          echo "the server never came up"
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - name: Test
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
          INTELPULSE_SERVER_URL: http://127.0.0.1:8124/
        run: |
          # printed by the server's own CLI, the way an operator gets it
          export INTELPULSE_SETUP_CODE="$(cd backend && python -m app.cli setup-code | tail -1)"
          node web/tests/server.spec.mjs
      - name: The server's log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"


  deploy:
    name: deploy kit · Docker, Postgres, smoke test, backup and restore
    # deploy/ as an operator runs it on a clean machine: setup.sh builds the image and starts
    # Postgres, Redis, the app, the worker and beat; smoke.py waits for the worker's heartbeat,
    # makes the owner, signs a new account up, triages a sample and checks the verdict; then a
    # dump goes out with backup.sh and back with restore.sh. The tunnel stays off: it needs a
    # Cloudflare account, and the smoke test runs the same against its address.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Set up and start the server
        env:
          PUBLIC_URL: http://localhost:8000
          CLOUDFLARE_TUNNEL_TOKEN: ""
        run: ./deploy/setup.sh < /dev/null
      - name: Smoke test
        run: |
          code="$(docker compose -f deploy/compose.yml exec -T app python -m app.cli setup-code | tail -1)"
          python3 deploy/smoke.py http://127.0.0.1:8000 --setup-code "$code"
      - name: Back up and restore
        run: |
          ./deploy/backup.sh
          dump="$(ls -1t deploy/backups/*.dump | head -1)"
          RESTORE_YES=yes ./deploy/restore.sh "$dump" < /dev/null
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/api/health; then break; fi
            sleep 2
          done
          users="$(docker compose -f deploy/compose.yml exec -T db psql -U intelpulse -tAc 'select count(*) from users')"
          echo "accounts after the restore: $users"
          test "$users" = "2"
          curl -fsS http://127.0.0.1:8000/healthz
      - name: The containers' logs
        if: failure()
        run: docker compose -f deploy/compose.yml logs --no-color --tail 200
